name: a2aops
description: Lint an A2A AgentCard and optionally run live conformance checks against a deployed agent.
inputs:
  card:
    description: Path to the agent card JSON file to lint.
    required: false
  agent-url:
    description: Base URL of a running agent to run conformance checks against.
    required: false
  strict:
    description: Treat warnings as failures.
    required: false
    default: "false"
  ignore:
    description: Comma-separated codes or prefixes to hide in the card check (for example "W203,S8").
    required: false
    default: ""
  baseline:
    description: Path to a baseline file written with --write-baseline; only new findings fail.
    required: false
    default: ""
  old-card:
    description: The card clients use today (URL or file). When set with card, runs a breaking-change diff and fails on it.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      env:
        A2AOPS_CARD: ${{ inputs.card }}
        A2AOPS_URL: ${{ inputs.agent-url }}
        A2AOPS_STRICT: ${{ inputs.strict }}
        A2AOPS_IGNORE: ${{ inputs.ignore }}
        A2AOPS_BASELINE: ${{ inputs.baseline }}
        A2AOPS_OLD_CARD: ${{ inputs.old-card }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        python -m pip install "$ACTION_PATH"
        flags=()
        [ "$A2AOPS_STRICT" = "true" ] && flags+=(--strict)
        if [ -z "$A2AOPS_CARD" ] && [ -z "$A2AOPS_URL" ]; then
          echo "set card and/or agent-url" >&2; exit 2
        fi
        cardflags=(${flags[@]+"${flags[@]}"})
        [ -n "$A2AOPS_IGNORE" ] && cardflags+=(--ignore "$A2AOPS_IGNORE")
        [ -n "$A2AOPS_BASELINE" ] && cardflags+=(--baseline "$A2AOPS_BASELINE")
        status=0
        if [ -n "$A2AOPS_CARD" ]; then
          a2aops card check "$A2AOPS_CARD" ${cardflags[@]+"${cardflags[@]}"} || status=$?
        fi
        if [ -n "$A2AOPS_CARD" ] && [ -n "$A2AOPS_OLD_CARD" ]; then
          a2aops card diff "$A2AOPS_OLD_CARD" "$A2AOPS_CARD" || status=$?
        fi
        if [ -n "$A2AOPS_URL" ]; then
          a2aops conformance "$A2AOPS_URL" ${flags[@]+"${flags[@]}"} || status=$?
        fi
        exit "$status"
