[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "a2aops"
version = "1.3.0"
description = "Lint, diff, verify and conformance-test A2A agents and AgentCards from one zero-dependency CLI; SARIF/JUnit output for CI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Calas Automations Inc." }]
keywords = ["a2a", "agent-to-agent", "agentcard", "agents", "protocol", "linter", "conformance", "sarif", "devtools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.urls]
Homepage = "https://calasautomations.com"

[project.scripts]
a2aops = "a2aops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
a2aops = ["spec_snapshot.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
